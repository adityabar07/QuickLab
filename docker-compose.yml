services:
  quicklab:
    build:
      context: .
      dockerfile: Dockerfile
    container_name: quicklab_engine
    restart: unless-stopped
    ports:
      - "8000:8000"
    environment:
      - QUICKLAB_ENV=production
      - PORT=8000
      - HOST=0.0.0.0
      - CORS_ORIGINS=${CORS_ORIGINS:-http://localhost:5173,http://127.0.0.1:5173,http://localhost:3000,http://127.0.0.1:8000}
      - EXECUTION_TIMEOUT_SECONDS=15
      - MAX_OUTPUT_BYTES=5242880
      - MAX_ACTIVE_SESSIONS=200
      - SESSION_IDLE_TIMEOUT_SECONDS=1800
    volumes:
      - quicklab_sessions:/app/sessions
    deploy:
      resources:
        limits:
          cpus: '2.0'
          memory: 1024M
        reservations:
          cpus: '0.5'
          memory: 256M
    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost:8000/api/health"]
      interval: 30s
      timeout: 5s
      retries: 3
      start_period: 10s

volumes:
  quicklab_sessions:
    driver: local
